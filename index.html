<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>বাংলাদেশ প্রবাসী মঞ্চ ফাউন্ডেশন</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#0b1f3a;color:#fff}
header{background:#0d47a1;padding:18px;text-align:center}
.container{max-width:900px;margin:auto;padding:15px}
.card{background:#ffffff12;border-radius:14px;padding:15px;margin:15px 0}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none}
button{width:100%;padding:12px;background:#00c853;color:#fff;border:none;border-radius:8px;font-weight:bold}
.hidden{display:none}
</style>
</head>
<body>

<header>
  <h2>🇧🇩 বাংলাদেশ প্রবাসী মঞ্চ ফাউন্ডেশন</h2>
  <p>ঐক্য • সেবা • কল্যাণ</p>
</header>

<div class="container"><!-- Registration -->
<div class="card" id="register">
  <h3>📝 সদস্য রেজিস্ট্রেশন</h3>
  <input id="name" placeholder="পূর্ণ নাম">
  <input id="father" placeholder="বাবার নাম">
  <input id="mobile" placeholder="মোবাইল নম্বর">
  <input id="district" placeholder="জেলা">
  <input id="pass" type="password" placeholder="পাসওয়ার্ড">
  <button onclick="register()">রেজিস্ট্রেশন</button>
  <p onclick="showLogin()" style="margin-top:10px;color:#90caf9">আগে সদস্য? লগইন করুন</p>
</div>

<!-- Login -->
<div class="card hidden" id="login">
  <h3>🔐 সদস্য লগইন</h3>
  <input id="lmobile" placeholder="মোবাইল নম্বর">
  <input id="lpass" type="password" placeholder="পাসওয়ার্ড">
  <button onclick="login()">লগইন</button>
  <p onclick="showRegister()" style="margin-top:10px;color:#90caf9">নতুন সদস্য? রেজিস্ট্রেশন</p>
</div>
<!-- Member Dashboard -->
<div class="card hidden" id="home">
  <h3>👋 স্বাগতম</h3>
  <p id="welcome"></p>

  <hr><br>

  <p>🌐 অনলাইন লিংক</p>

  <p><a href="https://www.facebook.com/share/1DPBjB3ePJ/" target="_blank">Facebook</a></p>
  <p><a href="https://www.youtube.com/@Bangladeshprobashifundclubf" target="_blank">YouTube</a></p>
  <p><a href="https://chat.whatsapp.com/D09urUItfkdEjiVtqgIbY7" target="_blank">WhatsApp</a></p>

  <br>
  <button onclick="logout()">Logout</button>
</div>

<script>
function showLogin(){
  register.classList.add("hidden");
  login.classList.remove("hidden");
}
function showRegister(){
  login.classList.add("hidden");
  register.classList.remove("hidden");
}
function register(){
  const m={
    name:name.value,
    father:father.value,
    mobile:mobile.value,
    district:district.value,
    pass:pass.value
  };
  localStorage.setItem("member",JSON.stringify(m));
  alert("রেজিস্ট্রেশন সফল");
  showLogin();
}
function login(){
  const m=JSON.parse(localStorage.getItem("member")||"null");
  if(!m) return alert("আগে রেজিস্ট্রেশন করুন");
  if(lmobile.value===m.mobile && lpass.value===m.pass){
    login.classList.add("hidden");
    home.classList.remove("hidden");
    welcome.innerText=m.name+" ("+m.district+")";
  }else alert("ভুল তথ্য");
}
function logout(){
  home.classList.add("hidden");
  showLogin();
}
</script>

</div>
</body>
</html>
