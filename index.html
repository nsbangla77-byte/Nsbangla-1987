<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probashi Moncho App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div class="max-w-md mx-auto bg-white min-h-screen shadow-lg pb-10">
    <div class="bg-blue-600 p-10 text-center text-white rounded-b-[40px] shadow-lg mb-8">
        <div class="w-20 h-20 bg-white rounded-full mx-auto mb-4 flex items-center justify-center text-blue-600 text-3xl">
            <i class="fas fa-user-shield"></i>
        </div>
        <h1 id="main-title" class="text-xl font-bold uppercase">প্রবাসী মঞ্চ ফাউন্ডেশন</h1>
    </div>

    <div id="links-container" class="px-5"></div>

    <div class="text-center py-20">
        <button onclick="document.getElementById('login-box').classList.remove('hidden')" class="text-gray-400 text-xs">🔒 অ্যাডমিন এক্সেস</button>
    </div>
</div>

<!-- লগইন বক্স -->
<div id="login-box" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-6">
    <div class="bg-white p-6 rounded-2xl w-full max-w-xs text-center">
        <input type="text" id="u-name" placeholder="ইউজার নেম" class="w-full border p-2 mb-2 rounded-lg">
        <input type="password" id="u-pass" placeholder="পাসওয়ার্ড" class="w-full border p-2 mb-4 rounded-lg">
        <button onclick="checkLogin()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">লগইন</button>
    </div>
</div>

<!-- অ্যাডমিন প্যানেল -->
<div id="admin-panel" class="hidden fixed bottom-0 inset-x-0 bg-white p-6 rounded-t-3xl shadow-2xl border-t-4 border-blue-500 max-w-md mx-auto">
    <input type="text" id="set-title" placeholder="অ্যাপের নাম বদলান" class="w-full border p-2 mb-2 rounded-lg">
    <input type="text" id="feat-name" placeholder="ফিচারের নাম (যেমন: ফেসবুক)" class="w-full border p-2 mb-2 rounded-lg">
    <input type="text" id="feat-url" placeholder="লিঙ্ক (যেমন: facebook.com)" class="w-full border p-2 mb-4 rounded-lg">
    <button onclick="saveData()" class="w-full bg-green-600 text-white p-3 rounded-xl font-bold">সেভ করুন</button>
    <button onclick="sessionStorage.clear(); location.reload();" class="mt-4 text-red-500 text-xs w-full text-center">লগআউট</button>
</div>

<script>
    let myAppData = JSON.parse(localStorage.getItem('monchoData')) || {
        title: "প্রবাসী মঞ্চ ফাউন্ডেশন",
        links: []
    };

    function render() {
        document.getElementById('main-title').innerText = myAppData.title;
        const container = document.getElementById('links-container');
        container.innerHTML = "";
        myAppData.links.forEach((link, index) => {
            container.innerHTML += `<div class="relative">
                <a href="${link.url}" target="_blank" class="flex items-center bg-white border p-4 mb-3 rounded-xl shadow-sm font-bold text-gray-700">
                    <i class="fas fa-external-link-alt mr-3 text-blue-600"></i> ${link.name}
                </a>
                <button onclick="deleteLink(${index})" class="adm-btn hidden absolute right-2 top-4 text-red-400"><i class="fas fa-trash"></i></button>
            </div>`;
        });
        if(sessionStorage.getItem('isLoggedIn') === 'true') {
            document.getElementById('admin-panel').classList.remove('hidden');
            document.querySelectorAll('.adm-btn').forEach(b => b.classList.remove('hidden'));
        }
    }

    function checkLogin() {
        if(document.getElementById('u-name').value === "MDRAFIK159123" && document.getElementById('u-pass').value === "159123") {
            sessionStorage.setItem('isLoggedIn', 'true');
            location.reload();
        } else { alert("ভুল তথ্য!"); }
    }

    function saveData() {
        const t = document.getElementById('set-title').value;
        const n = document.getElementById('feat-name').value;
        let u = document.getElementById('feat-url').value;

        if(t) myAppData.title = t;
        if(n && u) {
            if (!u.startsWith('http')) u = 'https://' + u;
            myAppData.links.push({ name: n, url: u });
            localStorage.setItem('monchoData', JSON.stringify(myAppData));
            alert("সেভ হয়েছে!");
            location.reload();
        } else if(!n || !u) {
            alert("ফিচারের নাম এবং লিঙ্ক দিন।");
        }
    }

    function deleteLink(i) {
        myAppData.links.splice(i, 1);
        localStorage.setItem('monchoData', JSON.stringify(myAppData));
        render();
    }

    render();
</script>
</body>
</html>
